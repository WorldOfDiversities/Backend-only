services:
  - type: web
    name: pos-backend
    env: python
    rootDir: BACKEND
    plan: free
    buildCommand: pip install pipenv && pipenv install --system --deploy
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "pos-backend.onrender.com"
      - key: DJANGO_CORS_ALLOW_ALL
        value: "False"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "https://pos-frontend.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://pos-frontend.onrender.com"
      - key: FRONTEND_URL
        value: "https://pos-frontend.onrender.com"
      - key: PASSWORD_RESET_URL_TEMPLATE
        value: "https://pos-frontend.onrender.com/reset-password.html?token={token}"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"

  - type: web
    name: pos-frontend
    env: static
    rootDir: FRONTEND
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /
        destination: /index.html
